name: Test
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history + tags so the bundled auto-semver plugin can compute project.version.
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build with Gradle
        run: ./gradlew check

      - uses: actions/upload-artifact@v7
        if: success() || failure()
        with:
          name: test-results
          path: '**/build/reports/**'

      - uses: mikepenz/action-junit-report@v6
        if: success() || failure()
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./plugin/build/reports/jacoco/test/jacocoTestReport.xml,./plugin/build/reports/jacoco/functionalTestReport/functionalTestReport.xml
